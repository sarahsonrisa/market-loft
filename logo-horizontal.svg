<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="markGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" style="stop-color:#D946EF;stop-opacity:1" />
      <stop offset="46%" style="stop-color:#6D28D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67E8F9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(100, 100)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="45" stroke="url(#markGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Top point -->
    <path d="M 0 -40 Q 10 -15 0 0 Q -10 -15 0 -40" stroke="url(#markGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Right point -->
    <path d="M 40 0 Q 15 10 0 0 Q 15 -10 40 0" stroke="url(#markGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Bottom point -->
    <path d="M 0 40 Q -10 15 0 0 Q 10 15 0 40" stroke="url(#markGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Left point -->
    <path d="M -40 0 Q -15 -10 0 0 Q -15 10 -40 0" stroke="url(#markGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="220" y="125" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-0.04em" fill="white">Market<tspan font-style="italic" font-weight="400" font-size="70">Loft</tspan></text>
</svg>